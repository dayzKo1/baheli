<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>八合里 - 部位详情</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: #000;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .main-image {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: block;
    }

    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 25px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      backdrop-filter: blur(10px);
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    @media (max-width: 480px) {
      .back-btn {
        top: 15px;
        left: 15px;
        padding: 10px 18px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <a href="index.html" class="back-btn">← 返回部位图</a>

  <img
    src="00.jpg"
    alt="八合里主页设计"
    class="main-image"
    id="mainImage"
  />

  <script>
    /**
     * 获取URL参数并设置页面标题
     */
    function initPageInfo() {
      const params = new URLSearchParams(window.location.search);
      const partNames = {
        'naixiangxuehua': '奶香雪花',
        'ruanenshirou': '软嫩匙肉',
        'jinshuangshibing': '劲爽匙柄',
        'tanyaxiongkouyou': '弹牙胸口油',
        'shuangcuisanhuazhi': '爽脆三花趾',
        'xiantiandiaolong': '鲜甜吊龙',
        'zhixiangfeipian': '脂香肥胼',
        'jingxuanenrou': '精选嫩肉',
        'shuangkoushuangcengrou': '爽口双层肉',
        'cuidanwuhuazhi': '脆弹五花趾'
      };

      const part = params.get('part');
      if (part && partNames[part]) {
        document.title = `${partNames[part]} - 八合里`;
      }
    }

    window.addEventListener('DOMContentLoaded', initPageInfo);
  </script>
</body>
</html>
